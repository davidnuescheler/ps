<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Allocation Manager — Public Sediments</title>
  <meta name="description" content="Month-by-month case allotments and customer allocations for Public Sediments.">
  <link rel="canonical" href="https://main--ps--davidnuescheler.aem.live/allocation-manager/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Public Sediments">
  <meta property="og:title" content="Allocation Manager — Public Sediments">
  <meta property="og:description" content="Month-by-month case allotments and customer allocations for Public Sediments.">
  <meta property="og:url" content="https://main--ps--davidnuescheler.aem.live/allocation-manager/">
  <meta property="og:image" content="https://main--ps--davidnuescheler.aem.live/allocation-manager/og-image.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Public Sediments allocation manager">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Allocation Manager — Public Sediments">
  <meta name="twitter:description" content="Month-by-month case allotments and customer allocations for Public Sediments.">
  <meta name="twitter:image" content="https://main--ps--davidnuescheler.aem.live/allocation-manager/og-image.png">
  <meta name="twitter:image:alt" content="Public Sediments allocation manager">
  <link rel="icon" href="/icons/mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,300&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script>
    window.ALLOC_V = Date.now();
    document.write(`<link rel="stylesheet" href="./styles.css?v=${window.ALLOC_V}">`);
  </script>
</head>
<body data-page="place">
  <script>
    if (!localStorage.getItem('psAlloc_email')) document.body.classList.add('role-gate');
  </script>
  <header class="site-header">
    <div class="nav-bar">
      <a class="brand" href="../index.html">
        <span class="icon-mark" aria-hidden="true"></span>
        <span>
          <span class="brand-name">Public Sediments</span>
          <span class="brand-sub">Allocation manager</span>
        </span>
      </a>
      <div class="header-tools">
        <div class="waffle" id="waffle" hidden>
          <button class="waffle-btn" type="button" id="waffleBtn" aria-expanded="false" aria-haspopup="true" aria-controls="waffleMenu" aria-label="Menu">
            <span class="waffle-icon" aria-hidden="true"></span>
          </button>
          <div class="waffle-menu" id="waffleMenu" hidden>
            <nav class="waffle-nav" id="pageNav" hidden>
              <a href="./" aria-current="page">Place</a>
              <a href="./allocations.html">Allocations</a>
              <a href="./customers.html">Customers</a>
            </nav>
            <button class="session" type="button" id="sessionEmail" title="Log out">Log out</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <section class="gate" id="gate">
    <form class="gate-card" id="gateForm">
      <p class="gate-kicker">Public Sediments</p>
      <h1>Sign in with email</h1>
      <p class="muted">We’ll remember this address on this device.</p>
      <label for="gateEmail">Email</label>
      <input id="gateEmail" type="email" required autocomplete="username" inputmode="email">
      <p class="gate-note" id="gateNote" hidden></p>
      <button class="btn btn-solid" type="submit">Continue</button>
    </form>
  </section>

  <main class="wrap" id="app">
    <div class="toolbar">
      <div class="month-nav">
        <button class="ghost" id="prevMonth" aria-label="Previous month">←</button>
        <h1 id="monthLabel">September 2026</h1>
        <button class="ghost" id="nextMonth" aria-label="Next month">→</button>
      </div>
      <div class="stats" id="stats"></div>
    </div>

    <nav class="producer-nav" id="producerNav" aria-label="Producers"></nav>
    <nav class="wine-nav" id="wineNav" aria-label="Wines"></nav>

    <section class="board" id="board">
      <div class="loading">Loading allocations…</div>
    </section>

    <div class="row-actions staff-only">
      <button class="btn btn-solid" id="addWineBtn">Add wine</button>
      <button class="btn" id="showEmptyBtn" aria-pressed="false">Show empty accounts</button>
    </div>

    <div class="alloc-dock" id="allocDock" hidden>
      <button type="button" id="allocMinus" aria-label="Remove one bottle">−</button>
      <button type="button" id="allocPlus" aria-label="Add one bottle">+</button>
      <button type="button" id="allocSpread">Spread</button>
    </div>

  </main>

  <dialog id="wineDialog">
    <h2>Add wine</h2>
    <div class="picker-filters" id="winePickerFilters" role="toolbar" aria-label="Filter wines">
      <button type="button" class="picker-chip" data-filter="all" aria-pressed="true">All</button>
      <button type="button" class="picker-chip" data-filter="skin" aria-pressed="false">Skin contact</button>
      <button type="button" class="picker-chip" data-filter="red" aria-pressed="false">Red</button>
      <button type="button" class="picker-chip" data-filter="white" aria-pressed="false">White</button>
      <button type="button" class="picker-chip" data-filter="rose" aria-pressed="false">Rosé</button>
      <button type="button" class="picker-chip" data-filter="sparkling" aria-pressed="false">Sparkling</button>
      <label class="picker-search">
        <span class="picker-search-icon" aria-hidden="true"></span>
        <input id="winePickerSearch" type="search" placeholder="Search the list" autocomplete="off" spellcheck="false">
      </label>
    </div>
    <p class="picker-empty" id="winePickerEmpty" hidden>No wines match that search.</p>
    <div class="picker-list" id="winePickerList" role="listbox" aria-label="Current list"></div>
    <form class="form" id="wineForm">
      <p class="picker-selected" id="winePickerSelected">Pick a wine from the current list.</p>
      <div class="form-row">
        <div>
          <label for="wineCases">Cases this month</label>
          <input id="wineCases" type="number" min="0" step="0.001" value="1">
        </div>
        <div>
          <label for="wineRetail">Retail</label>
          <input id="wineRetail" type="number" min="0" step="1" placeholder="318">
        </div>
      </div>
      <div class="dialog-actions">
        <button class="btn" type="button" id="wineCancel">Cancel</button>
        <button class="btn btn-solid" type="submit" id="wineSave" disabled>Add to this month</button>
      </div>
    </form>
  </dialog>

  <script>
    const allocScript = document.createElement('script');
    allocScript.type = 'module';
    allocScript.src = `./scripts.js?v=${window.ALLOC_V}`;
    document.body.appendChild(allocScript);
  </script>
</body>
</html>
