<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Allocations — Public Sediments</title>
  <meta name="description" content="Customer allocations by month for Public Sediments.">
  <link rel="canonical" href="https://main--ps--davidnuescheler.aem.live/allocation-manager/allocations">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Public Sediments">
  <meta property="og:title" content="Allocations — Public Sediments">
  <meta property="og:description" content="Customer allocations by month for Public Sediments.">
  <meta property="og:url" content="https://main--ps--davidnuescheler.aem.live/allocation-manager/allocations">
  <meta property="og:image" content="https://main--ps--davidnuescheler.aem.live/allocation-manager/og-image.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Public Sediments allocations">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Allocations — Public Sediments">
  <meta name="twitter:description" content="Customer allocations by month for Public Sediments.">
  <meta name="twitter:image" content="https://main--ps--davidnuescheler.aem.live/allocation-manager/og-image.png">
  <link rel="icon" href="/icons/mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,300&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script>
    window.ALLOC_V = Date.now();
    document.write(`<link rel="stylesheet" href="./styles.css?v=${window.ALLOC_V}">`);
  </script>
</head>
<body data-page="allocations">
  <script>
    if (!localStorage.getItem('psAlloc_email')) document.body.classList.add('role-gate');
  </script>
  <header class="site-header"></header>
  <script>document.write(`<script src="./header.js?v=${window.ALLOC_V}"><\/script>`);</script>

  <section class="gate" id="gate">
    <form class="gate-card" id="gateForm">
      <p class="gate-kicker">Public Sediments</p>
      <h1>Sign in with email</h1>
      <p class="muted">We’ll remember this address on this device.</p>
      <label for="gateEmail">Email</label>
      <input id="gateEmail" type="email" required autocomplete="username" inputmode="email">
      <p class="gate-note" id="gateNote" hidden></p>
      <button class="btn btn-solid" type="submit">Continue</button>
    </form>
  </section>

  <main class="wrap" id="app">
    <div class="toolbar">
      <div class="month-nav" id="monthNav">
        <button class="ghost" id="prevMonth" aria-label="Previous month">←</button>
        <h1 id="monthLabel">Allocations</h1>
        <button class="ghost" id="nextMonth" aria-label="Next month">→</button>
      </div>
      <div class="stats" id="stats"></div>
    </div>
    <section class="board" id="board">
      <div class="loading">Loading allocations…</div>
    </section>
  </main>

  <script>
    const allocScript = document.createElement('script');
    allocScript.type = 'module';
    allocScript.src = `./allocations.js?v=${window.ALLOC_V}`;
    document.body.appendChild(allocScript);
  </script>
</body>
</html>
