<div class="wines-filters" role="toolbar" aria-label="Filter wines">
  <button type="button" class="chip" data-filter="all" aria-pressed="true">All</button>
  <button type="button" class="chip" data-filter="skin" aria-pressed="false">Skin contact</button>
  <button type="button" class="chip" data-filter="red" aria-pressed="false">Red</button>
  <button type="button" class="chip" data-filter="white" aria-pressed="false">White</button>
  <button type="button" class="chip" data-filter="rose" aria-pressed="false">Rosé</button>
  <button type="button" class="chip" data-filter="sparkling" aria-pressed="false">Sparkling</button>
  <label class="wines-search">
    <span class="wines-search-icon" aria-hidden="true"></span>
    <input type="search" placeholder="Search the list" autocomplete="off" spellcheck="false">
  </label>
</div>
<p class="wines-empty" hidden>No wines match that search.</p>
<div class="wines-grid">
  <p class="wines-status">Loading the current list…</p>
</div>
<p class="wines-more button-wrapper" hidden>
  <button type="button" class="button">Show all wines</button>
</p>
